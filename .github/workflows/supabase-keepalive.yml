name: Supabase keep-alive ping

# Free-tier Supabase projects pause after 7 days with no API activity. This
# hits the REST API every 3 days with a trivial, harmless read (via the
# public anon/publishable key, same one already shipped in the client bundle
# — nothing extra exposed) just to keep the "last active" clock reset.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # Hits the real `progress` table (schema.sql) instead of the /rest/v1/
        # discovery root — Supabase's new API key system rejects the root route
        # for publishable/anon keys ("Secret API key required"), which is why
        # every scheduled run since this workflow was added had been failing.
        # RLS means an anon request returns 0 rows, but that's fine — a 200
        # response is all that's needed to register as activity and reset the
        # inactivity clock. Prints status/body on failure instead of swallowing it.
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/progress?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}")
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Response body:"
            cat response.txt
            exit 1
          fi
