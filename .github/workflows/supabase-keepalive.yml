name: Supabase keep-alive ping

# Free-tier Supabase projects pause after 7 days with no API activity. This
# hits the REST API on a day-of-week schedule (max 2-day gap, vs. the ~3-4
# day gap of a day-of-month `*/N` cron, which also gets uneven around month
# boundaries) with a trivial, harmless read (via the public anon/publishable
# key, same one already shipped in the client bundle — nothing extra exposed)
# just to keep the "last active" clock reset.
on:
  schedule:
    - cron: '0 6 * * 0,2,4,6' # Sun/Tue/Thu/Sat 06:00 UTC — never more than 2 days apart
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # Hits the real `progress` table (schema.sql) instead of the /rest/v1/
        # discovery root — Supabase's new API key system rejects the root route
        # for publishable/anon keys ("Secret API key required"), which is why
        # every scheduled run since this workflow was added had been failing.
        # RLS means an anon request returns 0 rows, but that's fine — a 200
        # response is all that's needed to register as activity and reset the
        # inactivity clock. --retry rides out transient network blips so those
        # don't get counted as a missed ping. Prints status/body on failure
        # instead of swallowing it.
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-connrefused \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/progress?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}")
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Response body:"
            cat response.txt
            exit 1
          fi
